[project]
name = "doc-unlock"
version = "0.1.0"
description = "Unlock OOXML files (primarily PPTX) by removing edit protection"
authors = [
    {name = "Alexey Vaganov",email = "poofeg@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "msoffcrypto-tool (>=6.0.0,<7.0.0)",
    "olefile (>=0.46)",
    "typer (>=0.27.1,<0.28.0)",
]

[project.optional-dependencies]
http = ["fastapi[standard] (>=0.141.1,<0.142.0)"]

# Temporary forks for memory fixes, pending upstream merges.
# msoffcrypto-tool: https://github.com/nolze/msoffcrypto-tool/pull/102
# olefile: https://github.com/decalage2/olefile/pull/177
[tool.uv.sources]
msoffcrypto-tool = { git = "https://github.com/poofeg/msoffcrypto-tool.git" }
olefile = { git = "https://github.com/poofeg/olefile.git" }

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff (>=0.16.3)",
]

[project.scripts]
doc-unlock = "doc_unlock.interface.cli:app"

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
preview = true
select = [
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "C90",    # mccabe
    "E",      # pycodestyle Error
    "ERA",    # eradicate
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "PL",     # Pylint
    "Q",      # flake8-quotes
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle Warning
    "YTT",    # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.14"
platform = "linux"
follow_imports = "normal"
ignore_missing_imports = false
strict = true
enable_error_code = "explicit-override"

[[tool.mypy.overrides]]
module = "msoffcrypto"
ignore_missing_imports = true
